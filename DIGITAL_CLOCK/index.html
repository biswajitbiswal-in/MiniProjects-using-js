
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="clock-container">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-bar"></div>

                <div class="brand-text">
                    LESS<br>
                    BEAUTY<br>
                    MORE<br>
                    FUNCTION
                </div>
            </div>

            <div class="header-right">
                <h1>DIGITAL CLOCK</h1>
                <div class="header-line"></div>
            </div>
        </header>

        <!-- Digital Clock -->
        <section class="clock-section">

            <div class="clock">

                <div class="time-group">
                    <div class="time-box">
                        <span id="hours">00</span>
                    </div>
                    <p class="time-label">HOURS</p>
                </div>

                <span class="colon">:</span>

                <div class="time-group">
                    <div class="time-box">
                        <span id="minutes">00</span>
                    </div>
                    <p class="time-label">MINUTES</p>
                </div>

                <span class="colon">:</span>

                <div class="time-group">
                    <div class="time-box">
                        <span id="seconds">00</span>
                    </div>
                    <p class="time-label">SECONDS</p>
                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">

            <div class="date-section">
                <div class="date-line"></div>

                <h2 id="date">MON, JAN 01, 2026</h2>

                <p class="local-time">YOUR LOCAL TIME</p>
            </div>

            <div class="red-block"></div>

            <div class="footer-motto">
                <p>
                    TIME<br>
                    BUILDS<br>
                    BETTER<br>
                    THINGS
                </p>

                <div class="motto-line"></div>
            </div>

        </footer>

        <!-- Bottom Information -->
        <div class="bottom-note">
            <span>DESIGNED TO BE DIFFERENT.</span>
            <span>LOCAL TIME / 24H</span>
        </div>

        <!-- Decorative Shape -->
        <div class="corner-block"></div>

    </main>

</body>
<script src="script.js"></script>
</html>
